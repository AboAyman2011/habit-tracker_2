<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متعقب العادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&family=Outfit:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F2F3FB;
  --surface: #FFFFFF;
  --ink: #12163D;
  --muted: #5E658F;
  --line: #DDE0F2;
  --hero: #3B4BFF;
  --hero-ink: #FFFFFF;
  --c1: #3B4BFF;
  --c2: #12B886;
  --c3: #F59F00;
  --c4: #F03E5E;
  --c5: #8B5CF6;
  --warn: #E03150;
  --display: "Reem Kufi", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --body: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1030; --surface: #161B4A; --ink: #EEF0FF; --muted: #9BA3D6; --line: #272E6B;
    --hero: #3443F0; --c1: #7482FF; --c2: #2FD6A4; --c3: #FFC247; --c4: #FF6F8A; --c5: #A78BFA; --warn: #FF7C93;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1030; --surface: #161B4A; --ink: #EEF0FF; --muted: #9BA3D6; --line: #272E6B;
  --hero: #3443F0; --c1: #7482FF; --c2: #2FD6A4; --c3: #FFC247; --c4: #FF6F8A; --c5: #A78BFA; --warn: #FF7C93;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; transition: background-color .25s ease, color .25s ease; }
.wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
.num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }

/* header */
header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.ttl h1 { font-family: var(--display); font-size: 22px; line-height: 1.2; margin: 0; font-weight: 700; }
.sub { color: var(--muted); font-size: 13.5px; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.iconbtn { font: inherit; font-size: 18px; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.iconbtn:hover { border-color: var(--c1); }
.namechip { font: inherit; font-weight: 700; font-size: 15px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 42px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.namechip:hover { border-color: var(--c1); }
.namechip::after { content: " ✎"; color: var(--muted); font-weight: 400; font-size: 13px; }
#nameInput { font: inherit; font-weight: 700; color: var(--ink); background: var(--surface); border: 2px solid var(--c1); border-radius: 999px; padding: 6px 14px; width: 170px; min-height: 42px; }

/* hero quote */
.hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink); border-radius: 30px 30px 30px 8px; padding: 22px 20px 16px; margin-bottom: 16px; }
.hero::before { content: "\201D"; position: absolute; top: -34px; inset-inline-end: 12px; font-family: var(--display); font-size: 150px; line-height: 1; opacity: .16; pointer-events: none; }
.hq { position: relative; font-family: var(--display); font-size: clamp(20px, 5.4vw, 27px); line-height: 1.65; font-weight: 500; overflow-wrap: anywhere; min-height: 3.3em; }
.hs { position: relative; margin-top: 8px; font-size: 13.5px; opacity: .85; }
.hbtn { position: relative; margin-top: 12px; font: inherit; font-weight: 700; font-size: 14px; color: var(--hero-ink); background: transparent; border: 1.5px solid rgba(255,255,255,.7); border-radius: 999px; padding: 6px 16px; cursor: pointer; min-height: 38px; }
.hbtn:hover { background: rgba(255,255,255,.14); }
.hero :focus-visible { outline-color: #fff; }

/* tabs */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; margin-bottom: 16px; }
.tab { flex: 1; font: inherit; font-weight: 700; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer; min-height: 42px; transition: background-color .15s ease, color .15s ease; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }

/* panels / cards */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 24px; padding: 18px 14px; margin-bottom: 14px; }
h2 { font-family: var(--display); font-size: 19px; margin: 0 0 14px; font-weight: 700; }
h3 { font-size: 14.5px; margin: 20px 0 6px; color: var(--muted); font-weight: 700; }

/* rings */
.ring { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.ring .trk { fill: none; stroke: var(--line); }
.ring .val { fill: none; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring text { font-family: var(--display); font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; direction: ltr; unicode-bidi: isolate; }
.rings3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rg { text-align: center; min-width: 0; }
.rg .l { font-weight: 700; margin-top: 6px; font-size: 15px; }
.rg .s { color: var(--muted); font-size: 12.5px; }

.nudge { background: var(--surface); border: 1.5px solid var(--line); border-inline-start: 6px solid var(--c1); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; font-size: 15px; }
.nudge.warn { border-inline-start-color: var(--c4); }
.nudge.good { border-inline-start-color: var(--c2); }

.weeknav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.weeknav .label { font-weight: 700; }
.btn { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--c1); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .4; cursor: default; }

/* habit board */
.board { background: var(--surface); border: 1.5px solid var(--line); border-radius: 24px; overflow-x: auto; }
.grid { min-width: 340px; }
.row { display: grid; grid-template-columns: minmax(108px, 1.6fr) repeat(7, minmax(0, 1fr)); align-items: center; }
.hwrap { border-bottom: 1.5px solid var(--line); }
.hwrap:last-child { border-bottom: 0; }
.headrow { border-bottom: 1.5px solid var(--line); }
.dh { text-align: center; padding: 10px 0 8px; font-size: 12px; color: var(--muted); line-height: 1.3; }
.dh b { display: block; font-family: var(--display); font-size: 16px; color: var(--ink); font-weight: 700; }
.dh.today { background: color-mix(in srgb, var(--c3) 16%, var(--surface)); }

.hname { padding: 12px 12px; min-width: 0; border-inline-start: 5px solid var(--hc, var(--c1)); }
.hn { font: inherit; font-weight: 700; color: var(--ink); background: transparent; border: 0; padding: 0; cursor: pointer; text-align: start; overflow-wrap: anywhere; }
.hn::after { content: " ▾"; color: var(--muted); font-size: 12px; }
.hn[aria-expanded="true"]::after { content: " ▴"; }
.hname .m { font-size: 12px; color: var(--muted); }
.moti { font: inherit; font-size: 12.5px; margin-top: 4px; color: var(--hc, var(--c1)); background: transparent; border: 1.5px solid var(--hc, var(--c1)); border-radius: 999px; padding: 0 12px; cursor: pointer; }
.hname input.rename { font: inherit; width: 100%; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 8px; }

.c { position: relative; display: flex; justify-content: center; align-items: center; padding: 10px 0; align-self: stretch; }
.c.today { background: color-mix(in srgb, var(--c3) 16%, var(--surface)); }
.c.link::before { content: ""; position: absolute; top: 50%; inset-inline-start: 50%; width: 100%; height: 6px; transform: translateY(-50%); background: var(--hc, var(--c1)); opacity: .45; z-index: 0; }
.dot { position: relative; z-index: 1; width: clamp(26px, 8vw, 36px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; padding: 0; color: var(--hi, #fff); font-size: 16px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; font-family: var(--body); transition: background-color .12s ease, border-color .12s ease, transform .12s ease; }
.dot:hover:not(:disabled) { border-color: var(--hc, var(--c1)); }
.dot:active:not(:disabled) { transform: scale(.9); }
.dot:disabled { opacity: .3; cursor: default; background: transparent; border-style: dashed; }
.del { margin: 0 4px; border: 0; background: transparent; color: var(--warn); cursor: pointer; font: inherit; font-size: 22px; line-height: 1; padding: 4px 8px; }

.panel { padding: 6px 14px 16px; background: color-mix(in srgb, var(--paper) 60%, var(--surface)); border-inline-start: 5px solid var(--hc, var(--c1)); }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.facts div { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.facts span.k { display: block; font-size: 12px; color: var(--muted); }
.facts b { font-size: 14.5px; overflow-wrap: anywhere; }
.panel label { display: block; font-weight: 700; font-size: 14px; margin: 10px 0 4px; }
.panel textarea { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 10px; resize: vertical; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

.mot { margin: 0 14px 14px; padding: 12px 14px; border-radius: 16px; background: color-mix(in srgb, var(--hc, var(--c3)) 14%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--hc, var(--c3)) 55%, var(--line)); }
.mot .mq { font-family: var(--display); font-size: 18px; line-height: 1.55; overflow-wrap: anywhere; }
.mot .mw { color: var(--muted); font-size: 14px; margin-top: 6px; overflow-wrap: anywhere; }

.tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.add { display: flex; gap: 8px; flex: 1 1 260px; }
.add input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px; min-height: 42px; }
.note { color: var(--muted); font-size: 13px; margin-top: 16px; }
.rule { margin-top: 18px; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 14px; }
.rule b { color: var(--ink); }

details.backup { margin-top: 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 14px; }
details.backup summary { cursor: pointer; font-weight: 700; }
details.backup textarea { width: 100%; margin-top: 10px; min-height: 90px; font: 12.5px/1.4 monospace; direction: ltr; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; }
#bkMsg { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* stats */
.hstat { padding: 14px 0; border-top: 1.5px solid var(--line); }
.hstat .nm { min-width: 0; font-weight: 700; overflow-wrap: anywhere; padding-inline-start: 10px; border-inline-start: 5px solid var(--hc, var(--c1)); }
.hstat .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.minis { display: flex; justify-content: space-around; gap: 6px; margin-top: 12px; }
.mini { text-align: center; flex: 1 1 0; min-width: 0; }
.mini small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.empty { color: var(--muted); padding: 10px 0; }
.ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; padding-top: 16px; border-top: 1.5px solid var(--line); line-height: 1.9; }
.credit { font-family: var(--display); font-size: 15px; color: var(--ink); }
.credit b { color: var(--c1); }

.rings4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 8px; }
.rings4.compact { grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rings4.compact .rg .l { font-size: 13.5px; }
@media (min-width: 560px) { .rings4 { grid-template-columns: repeat(4, 1fr); } }
.basis { display: flex; gap: 4px; padding: 3px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; width: fit-content; max-width: 100%; margin: 14px auto 0; }
.bs { font: inherit; font-size: 13.5px; font-weight: 700; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 34px; }
.bs[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.basis-note { color: var(--muted); font-size: 12.5px; text-align: center; margin: 8px 0 14px; }
.welcome { background: var(--surface); border: 1.5px solid var(--line); border-radius: 30px 30px 30px 8px; padding: 24px 18px; }
.welcome h2 { font-size: 26px; margin: 0 0 6px; }
.welcome p { margin: 0 0 14px; color: var(--muted); }
.welcome label { display: block; font-weight: 700; margin: 16px 0 8px; }
.welcome input[type="text"] { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 16px; min-height: 46px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"]::before { content: "✓ "; }
.rowadd { display: flex; gap: 8px; margin-top: 12px; }
.rowadd input { flex: 1; min-width: 0; }
.startbtn { width: 100%; margin-top: 22px; min-height: 52px; font-size: 17px; }
.opt { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; }

html[lang="en"] { --display: "Outfit", "Segoe UI", system-ui, sans-serif; --body: "Inter", "Segoe UI", system-ui, sans-serif; }
header.top { flex-wrap: wrap; }
.who { flex-wrap: wrap; justify-content: flex-end; }
.langbtn { font-size: 14px; font-weight: 700; font-family: var(--body); }
.hq.ar { font-size: 20px; opacity: .92; margin-top: 10px; min-height: 0; direction: rtl; text-align: right; }
.dot[data-s="done"] { background: var(--hc, var(--c1)); border-color: var(--hc, var(--c1)); color: var(--hi, #fff); }
.dot[data-s="part"] { border-color: var(--hc, var(--c1)); color: var(--hc, var(--c1)); }
.dot[data-s="slip"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.dot[data-s="frozen"] { border-style: dashed; border-color: var(--c1); color: var(--c1); font-size: 14px; }
.dot[data-s="off"] { border-style: dashed; opacity: .55; color: var(--muted); }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px; cursor: pointer; min-height: 34px; }
.wchip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wchip:disabled { opacity: .4; cursor: default; }
.wchip.all { border-style: dashed; }
.sect { margin-top: 14px; }
.lbl { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.numin { font: inherit; width: 90px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.cnt { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
.cntv { font-family: var(--display); font-weight: 700; min-width: 54px; text-align: center; }
.lbl2 { font-size: 13.5px; color: var(--muted); }
.btn.sm { min-height: 34px; padding: 2px 12px; font-size: 14px; }
.rn { font-size: 13.5px; padding: 4px 0; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
.arch { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; font-size: 13.5px; }
.bt { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; display: block; }
.bf { display: block; height: 100%; background: var(--c2); border-radius: 999px; }
.bv { text-align: end; font-weight: 700; }
.hmwrap { direction: ltr; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
.hmm { display: grid; grid-template-columns: repeat(var(--n), 12px); gap: 3px; height: 14px; font-size: 10px; color: var(--muted); white-space: nowrap; margin-bottom: 2px; width: max-content; }
.hm { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; width: max-content; }
.hm i { display: block; border-radius: 3px; background: var(--line); }
.hm i.f { background: transparent; }
.hm i.n { opacity: .35; }
.hm i.d { background: var(--hc, var(--c1)); }
.hm i.s { background: var(--warn); }
.hm i.z { background: color-mix(in srgb, var(--c1) 35%, var(--surface)); }
.hm i.o { background: repeating-linear-gradient(135deg, var(--line) 0 2px, transparent 2px 4px); }
.hm i.m { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.hm i.l1 { background: color-mix(in srgb, var(--c1) 28%, var(--surface)); }
.hm i.l2 { background: color-mix(in srgb, var(--c1) 52%, var(--surface)); }
.hm i.l3 { background: color-mix(in srgb, var(--c1) 76%, var(--surface)); }
.hm i.l4 { background: var(--c1); }
.toast { position: fixed; inset-inline: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; background: var(--ink); color: var(--paper); border-radius: 18px; padding: 12px 16px; z-index: 50; font-weight: 700; text-align: center; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; min-height: 42px; }
.add { flex-wrap: wrap; }
.add input[type="number"] { flex: 0 0 96px; }
.opt select { margin-inline-start: 6px; min-height: 36px; }
#newHabit { flex: 1 1 100%; }
.weeknav .btn { padding: 6px 12px; font-size: 14px; }
.tabs .tab { padding: 8px 6px; font-size: 14.5px; }
.subrow { background: color-mix(in srgb, var(--paper) 55%, var(--surface)); }
.hname.sub { padding: 6px 10px; padding-inline-start: 20px; font-size: 14px; border-inline-start: 5px solid color-mix(in srgb, var(--hc, var(--c1)) 45%, transparent); }
.opt2 { color: var(--muted); font-size: 11.5px; }
.dot.sm { width: clamp(22px, 6.8vw, 28px); font-size: 13px; border-width: 1.5px; }
.del.armed { color: #fff; background: var(--warn); border-radius: 999px; font-size: 13px; padding: 4px 10px; }
.hm i.p { background: color-mix(in srgb, var(--hc, var(--c1)) 40%, var(--surface)); }
.flbl { display: block; font-weight: 700; font-size: 14px; margin: 12px 0 4px; }
.tin, textarea[data-field^="wr-"] { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 42px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.yr { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.yrt { flex: 1 1 170px; display: grid; gap: 6px; font-weight: 700; }
.wk7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.sqw { border: 2px solid transparent; border-radius: 14px; padding: 6px 0; text-align: center; cursor: pointer; color: var(--ink); font: inherit; min-width: 0; line-height: 1.25; }
.sqw span { display: block; font-size: 11px; opacity: .85; }
.sqw b { display: block; font-family: var(--display); font-size: 17px; }
.sqw small { display: block; font-size: 11px; }
.sqw[aria-pressed="true"], .calc[aria-pressed="true"] { border-color: var(--ink); }
.sqw:disabled, .calc:disabled { opacity: .4; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cwd { text-align: center; font-size: 11px; color: var(--muted); }
.calc { aspect-ratio: 1; border: 2px solid transparent; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); padding: 0; }
.zc0, .hm i.zc0 { background: color-mix(in srgb, var(--warn) 55%, var(--surface)); }
.zc1, .hm i.zc1 { background: color-mix(in srgb, var(--c5) 28%, var(--surface)); }
.zc2, .hm i.zc2 { background: color-mix(in srgb, var(--c5) 48%, var(--surface)); }

  function renderNudge(today) {

    var y = addDays(today, -1), msg = "", cls = "nudge";
    var slip = H.filter(function (h) { return h.type === "quit" && (isSlipK(key(today), h.id) || isSlipK(key(y), h.id)); })[0];
    var gap = null;
    H.forEach(function (h) {
      if (pausedNow(h)) return;
      var last = lastDoneDate(h, today);
      if (!last) return;
      var d = diffDays(today, last);
      if (d >= 3 && (!gap || d > gap.d)) gap = { h: h, d: d };
    });
    var missed = H.filter(function (h) { return !!lastDoneDate(h, today) && !done(y, h.id) && dueOn(h, y) && !done(today, h.id); });
    var due = H.filter(function (h) { return dueOn(h, today) || done(today, h.id); });
    var remaining = due.filter(function (h) { return !done(today, h.id); });
    if (slip) { msg = t("nudge_slip", { name: esc(slip.name) }); cls += " warn"; }
    else if (gap) { msg = t("nudge_restart", { d: num(gap.d), name: esc(gap.h.name) }); cls += " warn"; }

    else if (due.length === 0) { msg = t("nudge_rest"); cls += " good"; }

  /* ---------- الإحصائيات ---------- */
  function heatHtml(h, today) {
    var N = ui.hm, ws0 = addDays(weekStartFor(0), -(N - 1) * 7);
    var cells = "", months = "", prevM = -1, H = actives();
    var start = h ? habitStart(h) : earliestStart();
    for (var c = 0; c < N; c++) {
      var d0 = addDays(ws0, c * 7), lab = "";
      if (d0.getMonth() !== prevM) { lab = F.month.format(d0); prevM = d0.getMonth(); }
      months += "<span>" + esc(lab) + "</span>";
      for (var r = 0; r < 7; r++) {
        var d = addDays(d0, r), cls = "f", title = "";
        if (d <= today) {
          if (h) {
            var dk = key(d);
            if (doneK(dk, h.id)) { cls = "d"; title = t("hs_done"); }
            else if (h.type === "slots" && slotsTotalDone(dk, h) > 0) { cls = "p"; title = t("hs_part"); }
            else if (isSlipK(dk, h.id)) { cls = "s"; title = t("hs_slip"); }
            else if (isFrozenK(dk, h.id)) { cls = "z"; title = t("hs_frozen"); }
            else if (d < start) cls = "n";
            else if (!dueOn(h, d)) { cls = "o"; title = t("hs_rest"); }
            else { cls = "m"; title = t("hs_missed"); }
          } else {
            var a = aggregate(H, d, d);
            if (a.p === 0) cls = d < start ? "n" : "o";
            else {
              var rr = a.c / a.p;
              cls = rr === 0 ? "m" : rr < 0.34 ? "l1" : rr < 0.67 ? "l2" : rr < 1 ? "l3" : "l4";
              title = Math.round(rr * 100) + "%";
            }
          }
        }
        cells += '<i class="' + cls + '"' + (d <= today ? ' title="' + esc(F.short.format(d) + (title ? " · " + title : "")) + '"' : "") + "></i>";
      }
    }
    return '<div class="hmwrap"><div class="hmm" style="--n:' + N + '">' + months + '</div><div class="hm" style="--n:' + N + '">' + cells + "</div></div>";
  }

  }
  function armDelete(tag, fn) {
    if (ui.delArm === tag) { ui.delArm = null; clearTimeout(ui.delTimer); fn(); return; }
    ui.delArm = tag; render();
    clearTimeout(ui.delTimer);
    ui.delTimer = setTimeout(function () { ui.delArm = null; render(); }, 3500);
  }

  document.addEventListener("click", function (e) {
    var tg = e.target.closest("[data-act]");
    if (!tg) return;
    var act = tg.getAttribute("data-act"), id = tg.getAttribute("data-id"), h = id ? getHabit(id) : null;
    if (act === "tab") { ui.page = tg.getAttribute("data-tab"); render(); }
    else if (act === "theme") { state.theme = currentTheme() === "dark" ? "light" : "dark"; save(); applyTheme(); }
    else if (act === "lang") { state.lang = state.lang === "en" ? "ar" : "en"; save(); applyLang(); }
    else if (act === "editname") startEditName();
    else if (act === "newquote") newQuote();
    else if (act === "basis") { state.basis = tg.getAttribute("data-v") === "full" ? "full" : "sofar"; save(); render(); }
    else if (act === "hm") { ui.hm = parseInt(tg.getAttribute("data-n"), 10) || 13; render(); }
    else if (act === "pick") { var pk = tg.getAttribute("data-k"); ui.pick[pk] = !ui.pick[pk]; renderWelcome(); }
    else if (act === "addcustom") addCustom();
    else if (act === "start") {
      var nm = el("wName").value.trim(), picks = pickedNames();
      if (!nm || picks.length === 0) return;
      state.name = nm.slice(0, 24);
      state.habits = picks.map(function (n) { return { id: uid(), name: n, why: "", motivation: "", cue: "", createdAt: Date.now(), type: "build", days: null, pauses: [], archived: false }; });
      state.log = {}; state.sd = {}; state.notes = {}; state.freeze = {}; state.slips = {};
      state.onboarded = true; state.quote = null;
      ui.page = "track"; ui.expanded = null; ui.setOpen = null;
      save(); renderName(); renderQuote(); render();
    }
    else if (act === "toggle" && h) {
      var dk = tg.getAttribute("data-date");
      if (h.type === "slots") { ui.expanded = h.id; render(); return; }
      cellClick(h, dk); save(); render(); celebrate(h, dk);
    }
    else if (act === "slot" && h) {
      var sdk = tg.getAttribute("data-date"), sk = tg.getAttribute("data-k");
      setSlot(sdk, h, sk, !slotDone(sdk, h, sk)); save(); render(); celebrate(h, sdk);
    }
    else if (act === "slotopt" && h) {
      var so = h.slots.filter(function (s) { return s.k === tg.getAttribute("data-k"); })[0];
      if (so) {
        if (!so.o && reqSlots(h).length <= 1) return;
        so.o = !so.o; recomputeSlots(h); save(); render();
      }
    }
    else if (act === "prev") { weekOffset--; render(); }
    else if (act === "next") { if (weekOffset < 0) { weekOffset++; render(); } }
    else if (act === "add") submitNewHabit();
    else if (act === "edit") { editMode = !editMode; ui.delArm = null; render(); }
    else if (act === "expand") {
      ui.expanded = ui.expanded === id ? null : id;
      if (ui.expanded !== id) ui.setOpen = null;
      render();
    }
    else if (act === "hset") { ui.setOpen = ui.setOpen === id ? null : id; render(); }
    else if (act === "del") armDelete(id, function () { removeHabit(id); save(); render(); });
    else if (act === "wd" && h) {
      var wd = parseInt(tg.getAttribute("data-d"), 10), days = h.days ? h.days.slice() : [0, 1, 2, 3, 4, 5, 6], i = days.indexOf(wd);
      if (i === -1) days.push(wd); else if (days.length > 1) days.splice(i, 1);
      h.days = days.length >= 7 ? null : days;
      save(); render();
    }
    else if (act === "wdall" && h) { h.days = null; save(); render(); }
    else if (act === "selday") { ui.sel[id] = tg.getAttribute("data-date"); render(); }
    else if (act === "freeze" && h) {
      var err = toggleFreeze(h, ui.sel[id] || key(startOfToday()));
      save(); render(); if (err) toast(t(err));
    }
    else if (act === "pause" && h) {
      var today0 = startOfToday();
      if (pausedNow(h)) {
        var op = h.pauses.filter(function (p) { return !p.to; })[0], yk = key(addDays(today0, -1));
        if (yk < op.from) h.pauses.splice(h.pauses.indexOf(op), 1); else op.to = yk;
      } else h.pauses.push({ from: key(today0), to: null });
      save(); render();
    }
    else if (act === "archive" && h) { h.archived = true; if (ui.expanded === id) { ui.expanded = null; ui.setOpen = null; } save(); render(); }
    else if (act === "restore" && h) { h.archived = false; save(); render(); }
    else if (act === "delfinal") armDelete("f" + id, function () { removeHabit(id); save(); render(); });
    else if (act === "sdate") { ui.sleepDate = tg.getAttribute("data-date"); ui.sleepForm = null; ui.slMsg = ""; render(); }
    else if (act === "slq") { var qv = parseInt(tg.getAttribute("data-v"), 10); ui.sleepForm.q = ui.sleepForm.q === qv ? 0 : qv; render(); }
    else if (act === "ssave") {
      var f = ui.sleepForm;
      if (!f || !validHM(f.bed) || !validHM(f.wake)) return;
      state.sleep[ui.sleepDate] = { bed: f.bed, wake: f.wake, q: f.q || 0, note: f.note || "" };
      ui.slMsg = t("sl_saved"); save(); render();
    }
    else if (act === "sdel") { delete state.sleep[ui.sleepDate]; ui.sleepForm = null; ui.slMsg = t("sl_deleted"); save(); render(); }
    else if (act === "bk-export") {
      var ta2 = el("bkText"); ta2.value = JSON.stringify(state); ta2.focus(); ta2.select(); el("bkMsg").textContent = t("msg_export");
    }
    else if (act === "bk-csv") {
      var ta3 = el("bkText"); ta3.value = buildCsv(); ta3.focus(); ta3.select(); el("bkMsg").textContent = t("msg_csv");
    }
    else if (act === "bk-import") {
      var txt = el("bkText").value.trim();
      if (!txt) { el("bkMsg").textContent = t("msg_empty"); return; }
      try {
        var s = normalize(JSON.parse(txt));
        if (!s) { el("bkMsg").textContent = t("msg_bad1"); return; }
        state = s; ui.expanded = null; ui.setOpen = null; ui.sel = {}; ui.sleepForm = null; ui.sleepDate = null;
        save(); applyLang(); el("bkMsg").textContent = t("msg_ok");
      } catch (err2) { el("bkMsg").textContent = t("msg_bad2"); }
    }
    else if (act === "reset") {
      var btn = el("resetBtn");
      if (!resetArmed) {
        resetArmed = true; btn.textContent = t("reset_confirm");
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () { resetArmed = false; btn.textContent = t("reset"); }, 4000);
      } else {
        resetArmed = false; clearTimeout(resetTimer); btn.textContent = t("reset");
        state = blankState(state.lang, { theme: state.theme, noRel: state.noRel, ws: state.ws });
        ui.expanded = null; ui.setOpen = null; ui.pick = {}; ui.extra = []; ui.sel = {}; ui.page = "track"; ui.sleepForm = null; ui.sleepDate = null; ui.slMsg = "";
        el("wName").value = "";
        save(); syncSettings(); renderName(); renderQuote(); render();
      }
    }
  });

  document.addEventListener("input", function (e) {
    var x = e.target;
    if (!x || x.id === "nameInput") return;
    if (x.id === "wName") { updateStartBtn(); return; }
    var f = x.getAttribute ? x.getAttribute("data-field") : null;
    if (!f) return;
    if (f === "sl-bed" || f === "sl-wake") {
      if (!ui.sleepForm) return;
      ui.sleepForm[f.slice(3)] = x.value;
      var live = el("slLive"); if (live) live.textContent = sleepLiveText();
      return;
    }
    if (f === "sl-note") { if (ui.sleepForm) ui.sleepForm.note = x.value; return; }
    if (f === "wr-a" || f === "wr-b") {
      var wk = x.getAttribute("data-wk"), r = state.reviews[wk] || {};
      r[f.slice(3)] = x.value;
      if (!r.a && !r.b) delete state.reviews[wk]; else state.reviews[wk] = r;
      save(); return;
    }
    var id = x.getAttribute("data-id"), h = getHabit(id);
    if (!h) return;
    if (f === "why" || f === "motivation" || f === "cue") { h[f] = x.value; save(); }
    else if (f === "note") { setNote(x.getAttribute("data-date"), id, x.value); save(); }
  });

  document.addEventListener("change", function (e) {
    var x = e.target;
    if (!x) return;
    if (x.id === "relToggle") { state.noRel = !x.checked; state.quote = null; save(); renderQuote(); return; }
    if (x.id === "wsSel") { state.ws = parseInt(x.value, 10); save(); syncSettings(); render(); return; }
    if (x.id === "newType") { el("newTarget").hidden = ["water", "meds", "multi"].indexOf(x.value) === -1; return; }
    var f = x.getAttribute ? x.getAttribute("data-field") : null;
    if (f === "sl-date") {
      var v = x.value, today = startOfToday();
      if (/^\d{4}-\d{2}-\d{2}$/.test(v) && parseKey(v) <= today) { ui.sleepDate = v; ui.sleepForm = null; ui.slMsg = ""; render(); }
      return;
    }
    if (f === "sg-h") { var gh = parseFloat(x.value); if (gh >= 4 && gh <= 12) { state.sleepGoal = gh; save(); render(); } return; }
    if (f === "sg-bed" || f === "sg-wake") { if (validHM(x.value)) { state[f === "sg-bed" ? "bedTarget" : "wakeTarget"] = x.value; save(); render(); } return; }
    if (f === "calc-wake") { if (validHM(x.value)) { ui.calcWake = x.value; render(); } return; }
    if (f === "slotn") {
      var hh = getHabit(x.getAttribute("data-id")), n = parseInt(x.value, 10);
      if (hh && hh.type === "slots" && hh.kind !== "prayers" && n >= 1 && n <= 30) {
        var old = hh.slots, ns = makeSlots(hh.kind, n);
        ns.forEach(function (s, i) { if (old[i]) s.o = old[i].o; });
        hh.slots = ns;
        var keep = {}; ns.forEach(function (s) { keep[s.k] = 1; });
        for (var dk in state.sd) { var a = state.sd[dk][hh.id]; if (a) { var b = a.filter(function (k) { return keep[k]; }); if (b.length) state.sd[dk][hh.id] = b; else delete state.sd[dk][hh.id]; if (!Object.keys(state.sd[dk]).length) delete state.sd[dk]; } }
        recomputeSlots(hh);
        save(); render();
      }
      return;
    }
    if (x.classList && x.classList.contains("rename")) {
      var id = x.getAttribute("data-id"), val = x.value.trim(), h2 = getHabit(id);
      if (h2 && val) h2.name = val;
      save(); render();
    }
  });

  document.addEventListener("focusout", function (e) { if (e.target && e.target.id === "nameInput") finishEditName(); });
  el("nameInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { finishEditName(); el("nameBtn").focus(); }
    else if (e.key === "Escape") { finishEditName(true); el("nameBtn").focus(); }
  });
  el("newHabit").addEventListener("keydown", function (e) { if (e.key === "Enter") submitNewHabit(); });
  el("wCustom").addEventListener("keydown", function (e) { if (e.key === "Enter") addCustom(); });

  applyLang();
})();
</script>
</body>
</html>
